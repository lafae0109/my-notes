  <title>为什么先从静态网站开始 · My Notes</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header><a href="../index.html">My Notes</a></header>

    <main>
      <h1>为什么先从静态网站开始</h1>
      <p class="lede">用最少的技术栈理解网页的组成：HTML 管结构，CSS 管表达。</p>

      <section>
        <h2>HTML 是结构</h2>
        <p>HTML 负责内容的语义和层级。一个页面从 <code>&lt;h1&gt;</code> 开始，
        用 <code>&lt;section&gt;</code> 组织独立的内容块。</p>
      </section>

      <section>
        <h2>CSS 是表达</h2>
        <p>CSS 负责视觉。本项目的颜色、间距、字体都来自 <code>style.css</code>
        顶部的 CSS 变量，页面本身不硬编码这些值。</p>
      </section>

      <section>
        <h2>要点回顾</h2>
        <ul>
          <li>HTML 管结构，CSS 管表达。</li>
          <li>设计变量集中在 style.css，页面只引用。</li>
          <li>新增笔记 = 复制这个文件 + 改内容 + 首页加一行。</li>
        </ul>
      </section>
    </main>

    <footer><a href="../index.html">← 返回目录</a></footer>
  </div>
</body>
</html>
