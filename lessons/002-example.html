<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例：如何整理一篇笔记 · My Notes</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header><a href="../index.html">My Notes</a></header>

    <main>
      <h1>示例：如何整理一篇笔记</h1>
      <p class="lede">这篇笔记演示：按 AGENTS.md 的流程，从 001 复制、改内容、首页加一行。</p>

      <section>
        <h2>第一步：复制</h2>
        <p>把 <code>lessons/001-hello.html</code> 复制成
        <code>lessons/002-example.html</code>，序号加一。</p>
      </section>

      <section>
        <h2>第二步：改内容</h2>
        <p>只改 <code>&lt;title&gt;</code>、<code>&lt;h1&gt;</code>、
        <code>.lede</code> 和各 section 的文字。结构不动。</p>
      </section>

      <section>
        <h2>第三步：更新首页</h2>
        <p>在 <code>index.html</code> 的列表里追加一行链接。完成。</p>
      </section>
    </main>

    <footer><a href="../index.html">← 返回目录</a></footer>
  </div>
</body>
</html>
